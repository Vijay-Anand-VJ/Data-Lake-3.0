name: Datalake 3.0 Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout codebase
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-level: '20'
          cache: 'npm'

      # 3. Setup JDK 17 (standard for React Native 0.85.3)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Install Node modules
      - name: Install dependencies
        run: npm ci

      # 5. Run static TypeScript type check
      - name: Verify TypeScript compilation
        run: npx tsc --noEmit

      # 6. Setup Android SDK cache to speed up builds
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      # 7. Grant execution permission for Gradlew
      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      # 8. Build Android Debug APK
      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      # 9. Upload the compiled APK artifact
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DatalakeApp-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
