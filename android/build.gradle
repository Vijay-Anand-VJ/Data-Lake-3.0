buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Automatically intercept and remove JCenter/Bintray safely to prevent CI build timeouts and errors
    if (project.state.executed) {
        def defunct = project.repositories.findAll { repo ->
            repo.hasProperty('url') && (repo.url.toString().contains("jcenter") || repo.url.toString().contains("bintray"))
        }
        defunct.each { repo ->
            project.repositories.remove(repo)
        }
    } else {
        project.afterEvaluate { p ->
            def defunct = p.repositories.findAll { repo ->
                repo.hasProperty('url') && (repo.url.toString().contains("jcenter") || repo.url.toString().contains("bintray"))
            }
            defunct.each { repo ->
                p.repositories.remove(repo)
            }
        }
    }
}
